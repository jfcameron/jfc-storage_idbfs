name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  emscripten:
    name: emscripten (wasm)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest

      - name: report the toolchain
        run: emcc --version

      - name: configure
        run: emcmake cmake --preset emscripten

      - name: build
        run: cmake --build --preset emscripten

      - name: test
        run: ctest --preset emscripten

  interface-latest:
    name: emscripten, against the interface's latest commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: take the interface's latest commit
        run: |
          git -C extern/jfc-storage fetch origin HEAD
          git -C extern/jfc-storage checkout --detach FETCH_HEAD
          git -C extern/jfc-storage submodule update --init --recursive
          git -C extern/jfc-storage log -1 --oneline

      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest

      - name: report the toolchain
        run: emcc --version

      - name: configure
        run: emcmake cmake --preset emscripten

      - name: build
        run: cmake --build --preset emscripten

      - name: test
        run: ctest --preset emscripten

  docs:
    name: documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install doxygen, graphviz and ninja
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz ninja-build

      - name: generate
        run: cmake --preset linux-docs

      - name: upload for github pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/build/linux-docs/docs

  pages:
    name: publish to github pages
    needs: docs
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

